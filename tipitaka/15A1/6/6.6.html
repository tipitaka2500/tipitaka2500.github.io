      <h3></h3>
      <p id="p_15A1_118"><span class="division-number" id="d56">56.</span> <span class="paragraph-number" id="118">118</span> “Ye keci, bhikkhave, dhammā akusalā akusalabhāgiyā akusalapakkhikā, sabbe te manopubbaṅgamā. Mano tesaṁ dhammānaṁ paṭhamaṁ uppajjati, anvadeva akusalā dhammā”ti.</p>
