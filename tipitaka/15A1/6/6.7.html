      <h3></h3>
      <p id="p_15A1_120"><span class="division-number" id="d57">57.</span> <span class="paragraph-number" id="120">120</span> “Ye keci, bhikkhave, dhammā kusalā kusalabhāgiyā kusalapakkhikā, sabbe te manopubbaṅgamā. Mano tesaṁ dhammānaṁ paṭhamaṁ uppajjati, anvadeva kusalā dhammā”ti.</p>
      <p class="center" id="p_15A1_121"><span class="paragraph-number" id="121">121</span> Sattamaṁ.</p>
