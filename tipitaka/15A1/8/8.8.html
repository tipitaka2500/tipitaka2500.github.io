      <h3></h3>
      <p id="p_15A1_164"><span class="division-number" id="d78">78.</span> <span class="paragraph-number" id="164">164</span> “Appamattikā esā, bhikkhave, parihāni yadidaṁ bhogaparihāni. Etaṁ patikiṭṭhaṁ, bhikkhave, parihānīnaṁ yadidaṁ paññāparihānī”ti.</p>
