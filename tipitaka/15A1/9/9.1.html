      <p id="p_15A1_173"><span class="division-number" id="d82">82.</span> <span class="paragraph-number" id="173">173</span> “Nāhaṁ, bhikkhave, aññaṁ ekadhammampi samanupassāmi yo evaṁ mahato anatthāya saṁvattati yathayidaṁ, bhikkhave, pamādo. Pamādo, bhikkhave, mahato anatthāya saṁvattatī”ti.</p>
