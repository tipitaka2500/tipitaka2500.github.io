      <p id="p_15A1_181"><span class="division-number" id="d86">86.</span> <span class="paragraph-number" id="181">181</span> “Nāhaṁ, bhikkhave, aññaṁ ekadhammampi samanupassāmi yo evaṁ mahato anatthāya saṁvattati yathayidaṁ, bhikkhave, mahicchatā. Mahicchatā, bhikkhave, mahato anatthāya saṁvattatī”ti.</p>
