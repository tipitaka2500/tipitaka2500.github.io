      <p id="p_15A1_187"><span class="division-number" id="d89">89.</span> <span class="paragraph-number" id="187">187</span> “Nāhaṁ, bhikkhave, aññaṁ ekadhammampi samanupassāmi yo evaṁ mahato atthāya saṁvattati yathayidaṁ, bhikkhave, santuṭṭhitā. Santuṭṭhitā, bhikkhave, mahato atthāya saṁvattatī”ti.</p>
      <p class="center" id="p_15A1_188"><span class="paragraph-number" id="188">188</span> Aṭṭhamaṁ.</p>
