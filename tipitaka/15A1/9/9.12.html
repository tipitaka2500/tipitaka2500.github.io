      <p id="p_15A1_195"><span class="division-number" id="d93">93.</span> <span class="paragraph-number" id="195">195</span> “Nāhaṁ, bhikkhave, aññaṁ ekadhammampi samanupassāmi yo evaṁ mahato atthāya saṁvattati yathayidaṁ, bhikkhave, sampajaññaṁ. Sampajaññaṁ, bhikkhave, mahato atthāya saṁvattatī”ti.</p>
