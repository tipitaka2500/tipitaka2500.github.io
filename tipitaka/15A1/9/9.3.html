      <p id="p_15A1_177"><span class="division-number" id="d84">84.</span> <span class="paragraph-number" id="177">177</span> “Nāhaṁ, bhikkhave, aññaṁ ekadhammampi samanupassāmi yo evaṁ mahato anatthāya saṁvattati yathayidaṁ, bhikkhave, kosajjaṁ. Kosajjaṁ, bhikkhave, mahato anatthāya saṁvattatī”ti.</p>
