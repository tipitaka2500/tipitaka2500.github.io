      <p id="p_15A1_185"><span class="division-number" id="d88">88.</span> <span class="paragraph-number" id="185">185</span> “Nāhaṁ, bhikkhave, aññaṁ ekadhammampi samanupassāmi yo evaṁ mahato anatthāya saṁvattati yathayidaṁ, bhikkhave, asantuṭṭhitā. Asantuṭṭhitā, bhikkhave, mahato anatthāya saṁvattatī”ti.</p>
