      <p id="p_15A1_76"><span class="division-number" id="d36">36.</span> <span class="paragraph-number" id="76">76</span> “Nāhaṁ, bhikkhave, aññaṁ ekadhammampi samanupassāmi yaṁ evaṁ rakkhitaṁ mahato atthāya saṁvattati yathayidaṁ, bhikkhave, cittaṁ. Cittaṁ, bhikkhave, rakkhitaṁ mahato atthāya saṁvattatī”ti.</p>
      <p class="center" id="p_15A1_77"><span class="paragraph-number" id="77">77</span> Chaṭṭhaṁ.</p>
