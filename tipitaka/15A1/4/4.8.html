      <h3></h3>
      <p id="p_15A1_80"><span class="division-number" id="d38">38.</span> <span class="paragraph-number" id="80">80</span> “Nāhaṁ, bhikkhave, aññaṁ ekadhammampi samanupassāmi yaṁ evaṁ saṁvutaṁ mahato atthāya saṁvattati yathayidaṁ, bhikkhave, cittaṁ. Cittaṁ, bhikkhave, saṁvutaṁ mahato atthāya saṁvattatī”ti.</p>
      <p class="center" id="p_15A1_81"><span class="paragraph-number" id="81">81</span> Aṭṭhamaṁ.</p>
