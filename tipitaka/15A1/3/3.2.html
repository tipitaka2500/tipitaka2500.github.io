      <p id="p_15A1_47"><span class="division-number" id="d22">22.</span> <span class="paragraph-number" id="47">47</span> “Nāhaṁ, bhikkhave, aññaṁ ekadhammampi samanupassāmi yaṁ evaṁ bhāvitaṁ kammaniyaṁ hoti yathayidaṁ, bhikkhave, cittaṁ. Cittaṁ, bhikkhave, bhāvitaṁ kammaniyaṁ hotī”ti.</p>
