      <h3>Paṇihitaacchavagga</h3>
      <h3></h3>
      <p id="p_15A1_101"><span class="division-number" id="d48">48.</span> <span class="paragraph-number" id="101">101</span> “Nāhaṁ, bhikkhave, aññaṁ ekadhammampi samanupassāmi yaṁ evaṁ lahuparivattaṁ yathayidaṁ cittaṁ. Yāvañcidaṁ, bhikkhave, upamāpi na sukarā yāva lahuparivattaṁ cittan”ti.</p>
      <p class="center" id="p_15A1_102"><span class="paragraph-number" id="102">102</span> Aṭṭhamaṁ.</p>
