      <p id="p_18Dh_46"><span class="division-number" id="d43">43.</span> <span class="paragraph-number" id="46">46</span> <span class="gatha"><i>Na taṁ mātā pitā kayirā,</i></span><br><span class="gatha"><i>aññe vāpi ca ñātakā;</i></span><br><span class="gatha"><i>Sammāpaṇihitaṁ cittaṁ,</i></span><br><span class="gatha"><i>seyyaso naṁ tato kare.</i></span></p>
      <p class="center" id="p_18Dh_47"><span class="paragraph-number" id="47">47</span> Cittavaggo tatiyo.</p>
