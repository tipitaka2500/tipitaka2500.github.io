      <p id="p_15A2_183"><span class="division-number" id="d100">100.</span> <span class="paragraph-number" id="183">183</span> “Dveme, bhikkhave, paṇḍitā. Katame dve? Yo ca anāgataṁ bhāraṁ na vahati, yo ca āgataṁ bhāraṁ vahati. Ime kho, bhikkhave, dve paṇḍitā”ti.</p>
