      <p id="p_15A2_133"><span class="division-number" id="d57">57.</span> <span class="paragraph-number" id="133">133</span> “Dveme, bhikkhave, buddhā. Katame dve? Tathāgato ca arahaṁ sammāsambuddho, paccekabuddho ca. Ime kho, bhikkhave, dve buddhā”ti.</p>
